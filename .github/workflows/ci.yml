name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Sanity-check node:sqlite is available on this runner's Node build
        run: |
          node --version
          node -e "require('node:sqlite'); console.log('node:sqlite OK')"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (compiled output, fake model adapters only — no network calls)
        run: npm run test:only
